<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro 2026 | Flamboyant</title>
    <style>
        :root {
            --bg-body: #0f1115;
            --bg-panel: #181b21;
            --text-main: #e0e0e0;
            --text-muted: #6c757d;
            --accent: #00d4ff;
            
            /* Cores Financeiras */
            --c-pagamento: #00b050;       
            --c-ponto: #7030a0;            
            --c-nf-mes: #7f7f7f;          
            --c-nf-pag: #fff200;          
            --c-justificativa: #b020a8;   
            --c-orcamento: #ff0055;       
            --c-oc: #2c5aa0;              
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* --- LAYOUT GRID --- */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        
        @media (min-width: 768px) {
            .main-grid { grid-template-columns: 1.5fr 1fr; }
        }

        /* --- COMPONENTES --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
        }

        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }

        .nav-btn {
            background: none; border: 1px solid var(--accent); color: var(--accent);
            padding: 5px 15px; cursor: pointer; border-radius: 4px; font-size: 1.2rem; transition: 0.3s;
        }
        .nav-btn:hover { background: var(--accent); color: var(--bg-body); }

        .panel {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* CALENDÁRIO */
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: var(--text-muted); margin-bottom: 10px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day {
            height: 45px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; cursor: pointer; position: relative; background: #232730; font-weight: 500; font-size: 0.9rem; transition: 0.2s;
        }
        .day:hover { transform: scale(1.1); z-index: 2; border: 1px solid var(--accent); }
        .day.empty { background: transparent; cursor: default; }

        /* ANIMAÇÃO DE DESTAQUE */
        .pulsing-highlight {
            border: 2px solid #fff !important;
            box-shadow: 0 0 15px var(--c-pagamento);
            animation: pulse-green 1.5s infinite;
            z-index: 10;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(0, 176, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 176, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 176, 80, 0); }
        }

        /* CALCULADORA DE BOLETO */
        .calculator-box { border-left: 4px solid var(--c-pagamento); }
        .calc-title { font-size: 1.1rem; margin-bottom: 15px; color: var(--c-pagamento); text-transform: uppercase; font-weight: bold; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: var(--text-muted); margin-bottom: 5px; font-size: 0.9rem; }
        .date-input {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444;
            background: #0f1115; color: white; font-family: inherit; font-size: 1rem;
            box-sizing: border-box;
        }
        .date-input:focus { outline: none; border-color: var(--accent); }

        .btn-check {
            width: 100%; padding: 12px; background: var(--c-pagamento); color: white; border: none;
            border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;
            margin-bottom: 15px;
        }
        .btn-check:hover { background: #00d662; }

        /* NOVOS ESTILOS PARA A LISTA DE PARCELAS */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .calc-result {
            background: rgba(0, 176, 80, 0.1);
            padding: 15px; border-radius: 6px; text-align: center;
            display: none; 
            border-left: 3px solid var(--c-pagamento);
        }
        
        .calc-result.show { display: flex; flex-direction: column; animation: fadeIn 0.4s; }
        .calc-result.error { background: rgba(255, 0, 85, 0.1); border-left-color: var(--c-orcamento); }
        
        .parcela-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        
        .parcela-numero { font-weight: bold; color: var(--accent); }
        .vencimento-original { font-size: 0.8rem; }
        
        .result-date { font-size: 1.6rem; font-weight: bold; color: var(--c-pagamento); margin: 5px 0; }
        .calc-result.error .result-date { color: var(--c-orcamento); font-size: 1.2rem; }
        
        .result-obs { font-size: 0.8rem; color: #e0e0e0; }

        /* CORES EVENTOS */
        .evt-pagamento { background-color: var(--c-pagamento); color: #fff; }
        .evt-nf-pag { background-color: var(--c-nf-pag); color: #000; font-weight: bold; }
        .evt-ponto { background-color: var(--c-ponto); color: #fff; }
        .evt-nf-mes { background-color: var(--c-nf-mes); color: #fff; }
        .evt-justificativa { background-color: var(--c-justificativa); color: #fff; }
        .evt-orcamento { background-color: var(--c-orcamento); color: #fff; }
        .evt-mixed { background: linear-gradient(135deg, var(--c-nf-pag) 50%, var(--c-nf-mes) 50%); color: #000; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <button class="nav-btn" onclick="changeMonth(-1)">&#10094;</button>
        <h1 id="monthYearDisplay">Janeiro 2026</h1>
        <button class="nav-btn" onclick="changeMonth(1)">&#10095;</button>
    </header>

    <div class="main-grid">
        
        <div>
            <div class="panel">
                <div class="weekdays">
                    <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
                </div>
                <div class="days-grid" id="daysGrid">
                    </div>
            </div>
            
            <div class="panel" id="detailsPanel" style="min-height: 80px; display: flex; flex-direction: column; justify-content: center;">
                <div style="font-size: 0.9rem; color: var(--text-muted);">Evento Selecionado:</div>
                <div id="detailsText" style="font-size: 1.2rem; font-weight: bold; margin-top: 5px;">Clique em um dia</div>
            </div>
        </div>

        <div>
            <div class="panel calculator-box">
                <div class="calc-title">Quando pagar meu boleto?</div>
                
                <div class="input-group">
                    <label>Data do Primeiro Vencimento:</label>
                    <input type="date" id="billDate" class="date-input" onchange="handleInputChange()">
                </div>

                <!-- NOVO: Seleção de Parcelas -->
                <div class="input-group">
                    <label>Quantidade de Parcelas:</label>
                    <select id="installments" class="date-input" onchange="handleInputChange()">
                        <option value="1">1x (À vista)</option>
                        <option value="2">2x</option>
                        <option value="3">3x</option>
                        <option value="4">4x</option>
                        <option value="5">5x</option>
                        <option value="6">6x</option>
                        <option value="12">12x</option>
                    </select>
                </div>

                <button class="btn-check" onclick="calculatePaymentDate(true)">Calcular Melhor Dia</button>

                <!-- NOVO: Container que vai receber os resultados dinâmicos -->
                <div id="resultsContainer" class="results-container">
                    <!-- Os resultados aparecerão aqui via JavaScript -->
                </div>
            </div>

            <div class="panel">
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">LEGENDA RÁPIDA</div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div style="display:flex; align-items:center; font-size:0.8rem;"><div style="width:10px; height:10px; background:var(--c-pagamento); margin-right:5px; border-radius:50%;"></div>Pagamento</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem;"><div style="width:10px; height:10px; background:var(--c-nf-pag); margin-right:5px; border-radius:50%;"></div>NF Pagto</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem;"><div style="width:10px; height:10px; background:var(--c-ponto); margin-right:5px; border-radius:50%;"></div>Ponto</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- BASE DE DADOS ---
        // Adicionei mais alguns meses fictícios apenas para testar parcelas longas se precisar
        const calendarData = {
            "2026-0": { 7: ["evt-nf-pag", "Limite Envio NF"], 8: ["evt-pagamento", "Pagamento"], 14: ["evt-nf-pag", "Limite Envio NF"], 15: ["evt-pagamento", "Pagamento"], 20: ["evt-ponto", "Fechamento do Ponto"], 21: ["evt-justificativa", "Limite Justificativa"], 22: ["evt-pagamento", "Pagamento"], 23: ["evt-nf-mes", "Limite NF (Mês Atual)"], 28: ["evt-nf-pag", "Limite Envio NF"], 29: ["evt-pagamento", "Pagamento"] },
            "2026-1": { 4: ["evt-nf-pag", "Limite Envio NF"], 5: ["evt-pagamento", "Pagamento"], 9: ["evt-nf-pag", "Limite Envio NF"], 12: ["evt-pagamento", "Pagamento"], 16: ["evt-orcamento", "Limite Remanejamento"], 17: ["evt-ponto", "Fechamento do Ponto"], 19: ["evt-pagamento", "Pagamento"], 25: ["evt-nf-pag", "Limite Envio NF"], 26: ["evt-pagamento", "Pagamento"] },
            "2026-2": { 4: ["evt-nf-pag", "Limite Envio NF"], 5: ["evt-pagamento", "Pagamento"], 11: ["evt-nf-pag", "Limite Envio NF"], 12: ["evt-pagamento", "Pagamento"], 18: ["evt-nf-pag", "Limite Envio NF"], 19: ["evt-pagamento", "Pagamento"], 20: ["evt-ponto", "Fechamento do Ponto"], 25: ["evt-mixed", "Limite NF Pagamento + Mês"], 26: ["evt-pagamento", "Pagamento"], 31: ["evt-nf-pag", "Limite Envio NF"] },
            "2026-3": { 2: ["evt-pagamento", "Pagamento"], 6: ["evt-orcamento", "Limite Remanejamento"], 8: ["evt-nf-pag", "Limite Envio NF"], 9: ["evt-pagamento", "Pagamento"], 14: ["evt-nf-pag", "Limite Envio NF"], 16: ["evt-pagamento", "Pagamento"], 20: ["evt-ponto", "Fechamento do Ponto"], 22: ["evt-nf-pag", "Limite Envio NF"], 23: ["evt-pagamento", "Pagamento"], 24: ["evt-nf-mes", "Limite NF Mês Atual"], 28: ["evt-nf-pag", "Limite Envio NF"], 30: ["evt-pagamento", "Pagamento"] },
            "2026-4": { 6: ["evt-nf-pag", "Limite Envio NF"], 7: ["evt-pagamento", "Pagamento"], 13: ["evt-nf-pag", "Limite Envio NF"], 14: ["evt-pagamento", "Pagamento"], 20: ["evt-ponto", "Fechamento do Ponto"], 25: ["evt-nf-mes", "Limite NF Mês Atual"], 26: ["evt-nf-pag", "Limite Envio NF"], 28: ["evt-pagamento", "Pagamento"] },
            "2026-5": { 2: ["evt-nf-pag", "Limite Envio NF"], 3: ["evt-pagamento", "Pagamento"], 10: ["evt-nf-pag", "Limite Envio NF"], 11: ["evt-pagamento", "Pagamento"], 17: ["evt-nf-pag", "Limite Envio NF"], 18: ["evt-pagamento", "Pagamento"], 20: ["evt-ponto", "Fechamento do Ponto"], 24: ["evt-nf-pag", "Limite Envio NF"], 25: ["evt-pagamento", "Pagamento"] },
            "2026-6": { 1: ["evt-pagamento", "Pagamento"], 15: ["evt-pagamento", "Pagamento"], 28: ["evt-pagamento", "Pagamento"] }, // Dados fictícios extra para testes
            "2026-7": { 5: ["evt-pagamento", "Pagamento"], 15: ["evt-pagamento", "Pagamento"], 25: ["evt-pagamento", "Pagamento"] }  // Dados fictícios extra para testes
        };

        // --- ESTADO GLOBAL ---
        let currentYear = 2026;
        let currentMonth = 0; 
        const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        
        let highlightedDate = null; 

        function renderCalendar(month, year) {
            const grid = document.getElementById('daysGrid');
            const display = document.getElementById('monthYearDisplay');
            
            grid.innerHTML = "";
            display.innerText = `${monthNames[month]} ${year}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(createCell('empty', ''));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const key = `${year}-${month}`;
                let cssClass = '';
                let desc = '';
                if (calendarData[key] && calendarData[key][day]) {
                    [cssClass, desc] = calendarData[key][day];
                }
                const cell = createCell(cssClass, day);
                
                if (highlightedDate && highlightedDate.day === day && highlightedDate.month === month && highlightedDate.year === year) {
                    cell.classList.add('pulsing-highlight');
                }

                cell.onclick = () => showDetails(day, monthNames[month], desc || "Sem eventos", cssClass);
                grid.appendChild(cell);
            }
        }

        function createCell(type, text) {
            const div = document.createElement('div');
            div.className = `day ${type}`;
            div.innerText = text;
            return div;
        }

        function showDetails(day, month, text, cssClass) {
            document.getElementById('detailsText').innerText = `${day} de ${month}: ${text}`;
            const panel = document.getElementById('detailsPanel');
            panel.style.borderLeft = cssClass ? `4px solid var(--c-${cssClass.replace('evt-','')})` : '4px solid #444';
            if(cssClass === 'evt-mixed') panel.style.borderLeft = '4px solid #fff';
        }

        function changeMonth(step) {
            currentMonth += step;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentMonth, currentYear);
        }

        // --- NOVA FUNÇÃO: Lida com mudanças nos inputs em tempo real ---
        function handleInputChange() {
            const inputDateStr = document.getElementById('billDate').value;
            if (inputDateStr) {
                calculatePaymentDate(false); // Calcula automaticamente se tiver data
            } else {
                drawPlaceholders(); // Apenas desenha as caixinhas vazias se não tiver data
            }
        }

        // --- NOVA FUNÇÃO: Desenha as caixinhas aguardando dados ---
        function drawPlaceholders() {
            const qtdParcelas = parseInt(document.getElementById('installments').value);
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            
            highlightedDate = null; // Remove o destaque do calendário
            renderCalendar(currentMonth, currentYear); // Atualiza o calendário sem destaque

            for (let i = 0; i < qtdParcelas; i++) {
                const card = document.createElement('div');
                card.className = 'calc-result show';
                card.style.opacity = '0.5'; // Deixa visualmente "apagado"
                card.style.borderLeftColor = 'var(--text-muted)'; // Cor neutra
                card.innerHTML = `
                    <div class="parcela-header">
                        <span class="parcela-numero">Parcela ${i + 1} de ${qtdParcelas}</span>
                        <span class="vencimento-original">Vence em: --/--/----</span>
                    </div>
                    <div class="result-date" style="color: var(--text-muted)">--/--</div>
                    <div class="result-obs">Aguardando cálculo...</div>
                `;
                container.appendChild(card);
            }
        }

        // --- FUNÇÃO AUXILIAR: Adiciona meses a uma data de forma segura ---
        function adicionarMeses(dataOriginal, mesesParaAdicionar) {
            let novaData = new Date(dataOriginal.getTime());
            let mesDesejado = (novaData.getMonth() + mesesParaAdicionar) % 12;
            novaData.setMonth(novaData.getMonth() + mesesParaAdicionar);
            
            // Correção para casos como 31/01 + 1 mês = 03/03 (o correto seria 28/02)
            if (novaData.getMonth() !== mesDesejado && novaData.getMonth() !== (mesDesejado + 12) % 12) {
                novaData.setDate(0); // Volta para o último dia do mês anterior
            }
            return novaData;
        }

        // --- FUNÇÃO PRINCIPAL ---
        function calculatePaymentDate(fromButton = true) {
            const inputDateStr = document.getElementById('billDate').value;
            const qtdParcelas = parseInt(document.getElementById('installments').value);
            const container = document.getElementById('resultsContainer');
            
            // Limpa resultados anteriores
            container.innerHTML = '';
            highlightedDate = null;

            if (!inputDateStr) {
                if (fromButton) {
                    container.innerHTML = `<div class="calc-result show error"><div class="result-date">Ops!</div><div class="result-obs">Por favor, selecione uma data completa.</div></div>`;
                    renderCalendar(currentMonth, currentYear); 
                } else {
                    drawPlaceholders();
                }
                return;
            }

            const [y, m, d] = inputDateStr.split('-').map(Number);
            const dataInicial = new Date(y, m - 1, d);

            let primeiraDataEncontrada = null; // Para focar no calendário depois

            // LOOP: Calcula para cada parcela
            for (let i = 0; i < qtdParcelas; i++) {
                // Calcula o vencimento desta parcela específica
                let dataVencimentoParcela = adicionarMeses(dataInicial, i);
                
                let checkDate = new Date(dataVencimentoParcela.getTime());
                const maxLookback = 45;
                let found = false;
                let daysBack = 0;

                let bestY, bestM, bestD; // Armazena o dia de pagamento encontrado

                // Busca a data de pagamento para ESTA parcela
                while (daysBack < maxLookback) {
                    const curY = checkDate.getFullYear();
                    const curM = checkDate.getMonth();
                    const curD = checkDate.getDate();
                    const key = `${curY}-${curM}`;

                    if (calendarData[key] && calendarData[key][curD]) {
                        const [type, desc] = calendarData[key][curD];
                        if (type === 'evt-pagamento') {
                            found = true;
                            bestY = curY; bestM = curM; bestD = curD;
                            
                            // Se for a primeira parcela, salvamos para destacar no calendário
                            if (i === 0) {
                                primeiraDataEncontrada = { day: bestD, month: bestM, year: bestY };
                            }
                            break;
                        }
                    }
                    checkDate.setDate(checkDate.getDate() - 1);
                    daysBack++;
                }

                // Cria o Card (HTML) do resultado desta parcela
                const cardParcela = document.createElement('div');
                cardParcela.className = found ? 'calc-result show' : 'calc-result show error';
                
                // Formatação das datas para exibir na tela (DD/MM/AAAA)
                const strVencOriginal = `${String(dataVencimentoParcela.getDate()).padStart(2,'0')}/${String(dataVencimentoParcela.getMonth()+1).padStart(2,'0')}/${dataVencimentoParcela.getFullYear()}`;
                
                if (found) {
                    const strMelhorData = `${String(bestD).padStart(2,'0')}/${String(bestM+1).padStart(2,'0')}/${bestY}`;
                    cardParcela.innerHTML = `
                        <div class="parcela-header">
                            <span class="parcela-numero">Parcela ${i + 1} de ${qtdParcelas}</span>
                            <span class="vencimento-original">Vence em: ${strVencOriginal}</span>
                        </div>
                        <div class="result-date">${strMelhorData}</div>
                        <div class="result-obs">Sugerido</div>
                    `;
                } else {
                    cardParcela.innerHTML = `
                        <div class="parcela-header">
                            <span class="parcela-numero">Parcela ${i + 1} de ${qtdParcelas}</span>
                            <span class="vencimento-original">Vence em: ${strVencOriginal}</span>
                        </div>
                        <div class="result-date" style="font-size: 1.2rem;">Sem dados</div>
                        <div class="result-obs">Data fora da base configurada.</div>
                    `;
                }

                // Adiciona o card na tela com um pequeno atraso (efeito visual de cascata)
                cardParcela.style.animationDelay = `${i * 0.1}s`;
                container.appendChild(cardParcela);
            }

            // Atualiza o calendário para focar na PRIMEIRA parcela e destacá-la
            if (primeiraDataEncontrada) {
                highlightedDate = primeiraDataEncontrada;
                currentMonth = primeiraDataEncontrada.month;
                currentYear = primeiraDataEncontrada.year;
                renderCalendar(currentMonth, currentYear);
            } else {
                renderCalendar(currentMonth, currentYear);
            }
        }

        // Inicializa a tela desenhando o primeiro placeholder vazio
        drawPlaceholders();
    </script>
</body>
</html>
